name: Desktop build

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Publish a GitHub Release with this tag (e.g. v1.0.0). Leave empty for a test build.'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: engine/requirements.txt

      - name: Build native engine
        run: |
          pip install -r engine/requirements.txt
          python engine/build_engine.py
          '{"id":"t","path":"README.md"}' | ./engine/dist/mdify-engine/mdify-engine.exe

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Build installer
        run: npm run dist:win

      - uses: actions/upload-artifact@v4
        with:
          name: Mdify-Windows
          path: release/*.exe
          if-no-files-found: error

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v') || inputs.release_tag != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.release_tag || github.ref_name }}
          target_commitish: ${{ github.sha }}
          name: Mdify ${{ inputs.release_tag || github.ref_name }}
          make_latest: true
          files: release/*.exe
          generate_release_notes: true
          body: |
            ## Mdify ${{ inputs.release_tag || github.ref_name }}: anything in, Markdown out

            Convert PDFs (including scanned ones), Word, PowerPoint, Excel, images, web pages, code, whole folders and zips into clean Markdown. Everything runs on your computer. Nothing is uploaded.

            ### Install on Windows
            1. Download **Mdify-Setup.exe** below.
            2. Run it. Windows may show **"Windows protected your PC"**, because the app isn't code-signed yet. Click **More info → Run anyway**.
            3. Pick an install folder and finish. Mdify appears in your Start menu.

            Press **F11** to switch between full screen and a window, and **?** to see every shortcut.

            ### No install?
            Use the web version in any browser; on Android, open it in Chrome and tap **Install app**.
